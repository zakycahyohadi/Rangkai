<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="Editor skematik + simulator rangkaian listrik DC di browser. Gratis, tanpa akun, bisa mendeteksi dan memperbaiki kesalahan rangkaian otomatis.">
<script>
/* Pengaturan situs
   goatcounter : kode akun GoatCounter (dashboard di https://<kode>.goatcounter.com). Kosongkan untuk mematikan statistik. */
window.RANGKAI_CONFIG={goatcounter:'zaky'};
</script>
<title>Rangkai Skematik</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700&display=swap">
<style>
/* Layout: full-bleed drafting sheet; floating glass panels (tool rail, library, inspector) on desktop; bottom dock + sheets on phone */
:root{
  --bg:#f2f4f6; --grid:rgba(23,37,58,.15); --grid2:rgba(23,37,58,.055);
  --panel:rgba(255,255,255,.86); --solid:#ffffff; --raise:#f6f8fa; --line:rgba(23,37,58,.12); --line2:rgba(23,37,58,.2);
  --text:#101925; --muted:#5a6676; --ink:#1d2a3c; --wire:#0e8a78; --net:#2c58a8;
  --accent:#d4612a; --accent-ink:#ffffff; --accent-soft:rgba(212,97,42,.12);
  --volt:#0fa58c; --neg:#4b66e8; --ok:#1d8753; --warn:#a86a0c; --warn-soft:rgba(168,106,12,.12); --danger:#cf2539; --danger-soft:rgba(207,37,57,.1);
  --shadow:0 1px 2px rgba(16,25,37,.06),0 8px 28px rgba(16,25,37,.09);
  --ui:'Plus Jakarta Sans',system-ui,-apple-system,'Segoe UI',sans-serif;
  --mono:'JetBrains Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  --r:14px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0a0e13; --grid:rgba(190,212,236,.14); --grid2:rgba(190,212,236,.045);
  --panel:rgba(17,23,31,.84); --solid:#121821; --raise:#18202b; --line:rgba(190,212,236,.1); --line2:rgba(190,212,236,.2);
  --text:#e5ecf3; --muted:#8c99a9; --ink:#c6d3e1; --wire:#33c2aa; --net:#8db3ff;
  --accent:#f08a4b; --accent-ink:#1b0d03; --accent-soft:rgba(240,138,75,.16);
  --volt:#3ee0c1; --neg:#8d9dff; --ok:#4ccf8a; --warn:#f0b54a; --warn-soft:rgba(240,181,74,.13); --danger:#ff5a6d; --danger-soft:rgba(255,90,109,.13);
  --shadow:0 1px 2px rgba(0,0,0,.3),0 10px 30px rgba(0,0,0,.35); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0a0e13; --grid:rgba(190,212,236,.14); --grid2:rgba(190,212,236,.045);
  --panel:rgba(17,23,31,.84); --solid:#121821; --raise:#18202b; --line:rgba(190,212,236,.1); --line2:rgba(190,212,236,.2);
  --text:#e5ecf3; --muted:#8c99a9; --ink:#c6d3e1; --wire:#33c2aa; --net:#8db3ff;
  --accent:#f08a4b; --accent-ink:#1b0d03; --accent-soft:rgba(240,138,75,.16);
  --volt:#3ee0c1; --neg:#8d9dff; --ok:#4ccf8a; --warn:#f0b54a; --warn-soft:rgba(240,181,74,.13); --danger:#ff5a6d; --danger-soft:rgba(255,90,109,.13);
  --shadow:0 1px 2px rgba(0,0,0,.3),0 10px 30px rgba(0,0,0,.35); color-scheme:dark}

html,body{height:100%}
body{background:var(--bg);color:var(--text);font:14px/1.45 var(--ui);overflow:hidden;-webkit-font-smoothing:antialiased;overscroll-behavior:none}
*{box-sizing:border-box}
[hidden]{display:none!important}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.i{width:18px;height:18px;flex:none;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
kbd{font:500 10.5px var(--mono);color:var(--muted);border:1px solid var(--line2);border-bottom-width:2px;border-radius:5px;padding:0 5px;background:var(--solid)}

#app{display:flex;flex-direction:column;height:100%}

/* top bar */
.top{display:flex;align-items:center;gap:8px;padding:8px 16px;background:var(--solid);border-bottom:1px solid var(--line);position:relative;z-index:6;min-height:56px}
.brand{display:flex;align-items:center;gap:9px;font-weight:800;font-size:17px;letter-spacing:-.01em;flex:none}
.logo{width:30px;height:30px;border-radius:9px;background:var(--text);color:var(--bg);display:grid;place-items:center}
.logo .i{width:20px;height:20px;stroke-width:1.9}
.proj{display:flex;align-items:center;gap:6px;border:0;background:transparent;padding:6px 8px;border-radius:8px;min-width:0;max-width:220px;color:var(--muted);font-weight:600}
.proj span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.proj:hover{background:var(--raise);color:var(--text)}
.proj .i{width:14px;height:14px}
.seg{display:flex;padding:3px;border-radius:11px;background:var(--raise);border:1px solid var(--line);margin-left:6px;flex:none}
.seg button{display:flex;align-items:center;gap:7px;border:0;background:transparent;padding:6px 13px;border-radius:8px;font-weight:600;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--solid);color:var(--text);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.seg button[data-mode="sim"][aria-pressed="true"]{color:var(--volt)}
.seg .i{width:15px;height:15px}
.grow{flex:1;min-width:0}
.search{display:flex;align-items:center;gap:9px;border:1px solid var(--line);background:var(--raise);border-radius:10px;padding:7px 10px 7px 11px;color:var(--muted);min-width:0;width:300px}
.search span{flex:1;text-align:left;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.search:hover{border-color:var(--line2)}
.ib{display:inline-flex;align-items:center;justify-content:center;gap:7px;height:36px;min-width:36px;padding:0 8px;border:0;border-radius:9px;background:transparent;font-weight:600;flex:none}
.ib:hover{background:var(--raise)}
.ib:disabled{opacity:.35;cursor:default;background:transparent}
.ib.text{padding:0 11px}
.sep{width:1px;height:22px;background:var(--line);flex:none}
.only-phone{display:none!important}

/* work area */
.work{position:relative;flex:1;min-height:0}
.stage{position:absolute;inset:0;overflow:hidden;background-color:var(--bg);
  background-image:radial-gradient(circle,var(--grid) 1px,transparent 1.25px),linear-gradient(to right,var(--grid2) 1px,transparent 1px),linear-gradient(to bottom,var(--grid2) 1px,transparent 1px)}
#sv{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none;user-select:none;-webkit-user-select:none}
.stage.t-wire #sv,.stage.t-place #sv{cursor:crosshair}
.stage.panning #sv{cursor:grabbing}
.stage.over-pin #sv{cursor:crosshair}

.glass{background:var(--panel);backdrop-filter:blur(16px) saturate(1.3);-webkit-backdrop-filter:blur(16px) saturate(1.3);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow)}

/* rail */
.rail{position:absolute;left:12px;top:12px;display:flex;flex-direction:column;gap:2px;padding:5px;z-index:4}
.rail .ib{width:40px;height:40px;position:relative}
.rail .ib[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.rail [data-act="lib"][aria-pressed="true"]{background:var(--accent-soft);color:var(--accent)}
.rail .rs{height:1px;background:var(--line);margin:4px 6px}
.tip{position:relative}
.tip::after{content:attr(data-tip);position:absolute;left:calc(100% + 10px);top:50%;transform:translateY(-50%);background:var(--text);color:var(--bg);font:600 12px var(--ui);padding:5px 9px;border-radius:7px;white-space:nowrap;opacity:0;pointer-events:none;transition:opacity .12s .25s}
.tip:hover::after{opacity:1}

/* panels */
.panel{position:absolute;display:flex;flex-direction:column;z-index:3;min-height:0}
.lib{left:70px;top:12px;bottom:12px;width:250px}
.insp{right:12px;top:12px;bottom:12px;width:316px}
.app-lib-closed .lib{display:none}
.phead{display:flex;align-items:center;gap:8px;padding:12px 12px 8px 16px}
.phead h2{margin:0;font-size:14px;font-weight:700;flex:1}
.phead .ib{height:30px;min-width:30px}
.handle{display:none}
.lsearch{margin:0 12px 6px;display:flex;align-items:center;gap:8px;border:1px solid var(--line);border-radius:10px;background:var(--solid);padding:0 10px}
.lsearch input{flex:1;border:0;background:transparent;padding:8px 0;outline:none;min-width:0}
.lsearch .i{color:var(--muted);width:16px;height:16px}
.lbody{overflow:auto;padding:4px 12px 14px;display:flex;flex-direction:column;gap:6px;min-height:0;flex:1}
.lbody h4{margin:8px 4px 2px;font:600 10.5px var(--mono);letter-spacing:.09em;text-transform:uppercase;color:var(--muted)}
.lgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.item{display:flex;flex-direction:column;align-items:center;gap:3px;padding:8px 3px 6px;border:1px solid var(--line);border-radius:10px;background:var(--solid);color:var(--ink);touch-action:pan-y;user-select:none;-webkit-user-select:none}
.item:hover{border-color:var(--line2);transform:translateY(-1px)}
.item[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft);color:var(--accent)}
.item svg{width:100%;height:28px;pointer-events:none}
.item svg path{fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.item svg path.f{fill:currentColor;stroke:none}
.item span{font-size:11.5px;font-weight:600;color:var(--text);line-height:1.15;text-align:center;pointer-events:none}
.item{transition:transform .12s,border-color .12s}

/* inspector */
.tabs{display:flex;gap:2px;padding:10px 10px 0;border-bottom:1px solid var(--line)}
.tab{border:0;background:transparent;padding:7px 10px 9px;font-weight:600;color:var(--muted);border-bottom:2px solid transparent;margin-bottom:-1px;display:flex;gap:6px;align-items:center}
.tab[aria-selected="true"]{color:var(--text);border-color:var(--accent)}
.badge{font:700 10px var(--mono);min-width:18px;height:18px;padding:0 5px;border-radius:9px;display:inline-grid;place-items:center;background:var(--warn-soft);color:var(--warn)}
.badge.ok{background:var(--accent-soft);color:var(--ok)}
.badge.bad{background:var(--danger-soft);color:var(--danger)}
.ibody{overflow:auto;padding:14px 16px 20px;display:flex;flex-direction:column;gap:16px;min-height:0;flex:1}
.ibody section{display:flex;flex-direction:column;gap:9px;min-width:0}
.ibody h3{margin:0;font:600 10.5px var(--mono);letter-spacing:.09em;text-transform:uppercase;color:var(--muted);display:flex;justify-content:space-between;align-items:center;gap:8px}
.ph{display:flex;gap:12px;align-items:center}
.ph .sym-ic{width:52px;height:40px;border-radius:10px;border:1px solid var(--line);background:var(--solid);display:grid;place-items:center;color:var(--ink);flex:none}
.ph .sym-ic svg{width:44px;height:30px}
.ph .sym-ic path{fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.ph .sym-ic path.f{fill:currentColor;stroke:none}
.ph b{display:block;font-size:17px;font-weight:700;letter-spacing:-.01em}
.ph small{display:block;font:500 11px var(--mono);color:var(--muted);margin-top:2px}
.fields{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.field{display:flex;flex-direction:column;gap:4px;min-width:0}
.field.full{grid-column:1/-1}
.field label{font-size:12px;color:var(--muted);font-weight:500}
.field input[type=text],.field select{width:100%;padding:8px 10px;border:1px solid var(--line);border-radius:9px;background:var(--solid);font:500 13px var(--mono);min-width:0}
.field input[type=text]:focus{border-color:var(--accent);outline:none;box-shadow:0 0 0 3px var(--accent-soft)}
.hintline{font-size:12px;color:var(--muted);margin:0}
.btns{display:flex;gap:6px;flex-wrap:wrap}
.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--solid);border-radius:9px;padding:7px 11px;font-weight:600;font-size:13px}
.btn:hover{border-color:var(--line2)}
.btn .i{width:15px;height:15px}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.dng:hover{border-color:var(--danger);color:var(--danger)}
.btn.sm{padding:5px 9px;font-size:12px}
.readout{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.ro{border:1px solid var(--line);border-radius:10px;padding:8px 10px;background:var(--solid);min-width:0}
.ro span{display:block;font-size:11px;color:var(--muted)}
.ro b{display:block;font:600 14px var(--mono);font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ro.warn{border-color:var(--warn);background:var(--warn-soft)}
.ro.bad{border-color:var(--danger);background:var(--danger-soft)}
.bands{display:flex;align-items:center;gap:10px}
.rbody{position:relative;width:118px;height:30px;flex:none}
.rbody::before{content:"";position:absolute;left:0;right:0;top:14px;height:2px;background:var(--muted)}
.rbody i{position:absolute;left:20px;right:20px;top:5px;bottom:5px;border-radius:9px;background:#d8c3a0;display:flex;gap:7px;padding:0 12px;align-items:stretch}
.rbody i em{width:6px;display:block}
.rbody i em:last-child{margin-left:auto}
.swt{display:flex;align-items:center;gap:10px}
.sw{width:46px;height:26px;border-radius:13px;border:0;background:var(--line2);position:relative;flex:none}
.sw::after{content:"";position:absolute;left:3px;top:3px;width:20px;height:20px;border-radius:50%;background:var(--solid);transition:transform .15s;box-shadow:0 1px 3px rgba(0,0,0,.25)}
.sw[aria-checked="true"]{background:var(--volt)}
.sw[aria-checked="true"]::after{transform:translateX(20px)}
input[type=range]{width:100%;accent-color:var(--accent)}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--solid);border-radius:20px;padding:4px 10px 4px 7px;font-size:12px;font-weight:600;display:flex;align-items:center;gap:6px}
.chip i{width:10px;height:10px;border-radius:50%;display:block}
.chip[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft)}
.list{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:11px;overflow:hidden;background:var(--solid)}
.lrow{display:grid;grid-template-columns:minmax(0,74px) minmax(0,1fr) auto;gap:10px;align-items:baseline;padding:8px 11px;border:0;border-top:1px solid var(--line);background:transparent;text-align:left;font:500 12px var(--mono);width:100%}
.lrow:first-child{border-top:0}
.lrow:hover{background:var(--raise)}
.lrow.on{background:var(--accent-soft);box-shadow:inset 3px 0 0 var(--accent)}
.lrow b{color:var(--net);font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lrow span{overflow-wrap:anywhere;color:var(--text)}
.lrow em{font-style:normal;color:var(--volt);font-weight:600;font-variant-numeric:tabular-nums}
.issue{display:grid;grid-template-columns:auto minmax(0,1fr);gap:10px;padding:10px 11px;border:0;border-top:1px solid var(--line);background:transparent;text-align:left;width:100%;font-size:13px}
.issue:first-child{border-top:0}
.issue .btns{margin-top:7px}
.ilink{border:0;background:transparent;padding:0;font-weight:700;text-align:left;color:var(--text);text-decoration:underline;text-decoration-color:var(--line2);text-underline-offset:3px}
.ilink:hover{text-decoration-color:var(--accent)}
.autorow{display:flex;gap:12px;align-items:center;padding:10px 12px;border:1px solid var(--line);border-radius:11px;background:var(--solid)}
.autorow b{display:block;font-size:13px}.autorow small{display:block;color:var(--muted);font-size:12px}

.issue .dot{width:9px;height:9px;border-radius:50%;margin-top:5px}
.issue.bad .dot{background:var(--danger)} .issue.warn .dot{background:var(--warn)} .issue.info .dot{background:var(--net)}
.issue b{display:block;font-weight:700}
.issue small{display:block;color:var(--muted);font-size:12.5px;margin-top:1px}
table.bom{width:100%;border-collapse:collapse;font:500 12px var(--mono)}
table.bom th{text-align:left;font:600 10.5px var(--mono);letter-spacing:.06em;text-transform:uppercase;color:var(--muted);padding:6px 8px;border-bottom:1px solid var(--line)}
table.bom td{padding:7px 8px;border-bottom:1px solid var(--line);vertical-align:top}
table.bom td:first-child{font-weight:700;font-variant-numeric:tabular-nums}
.tblwrap{overflow-x:auto;border:1px solid var(--line);border-radius:11px;background:var(--solid)}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.keys{display:grid;grid-template-columns:auto 1fr;gap:6px 12px;font-size:13px;align-items:center}
.keys kbd{justify-self:start}

/* hud & sim bar */
.hud{position:absolute;bottom:12px;left:332px;right:340px;display:flex;flex-wrap:wrap;gap:6px;align-items:center;pointer-events:none;z-index:2}
.app-lib-closed .hud{left:70px}
.hud .c{font:500 11.5px var(--mono);color:var(--muted);background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:4px 8px;font-variant-numeric:tabular-nums;backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
.hud .hint{font:500 12.5px var(--ui);color:var(--text)}
.simbar{position:absolute;top:12px;left:50%;transform:translateX(-50%);display:flex;align-items:center;gap:9px;padding:7px 14px 7px 11px;border-radius:30px;z-index:4;font-weight:600;font-size:13px;max-width:calc(100% - 32px);white-space:nowrap}
.simbar span{overflow:hidden;text-overflow:ellipsis}
.pulse{width:9px;height:9px;border-radius:50%;background:var(--volt);flex:none;box-shadow:0 0 0 0 var(--volt);animation:pulse 1.8s infinite}
.simbar.err .pulse{background:var(--danger);animation:none}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(62,224,193,.5)}70%{box-shadow:0 0 0 8px rgba(62,224,193,0)}100%{box-shadow:0 0 0 0 rgba(62,224,193,0)}}

/* svg drawing */
.sym{fill:none;stroke:var(--ink);stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
.symf{fill:var(--ink);stroke:none}
.hit{fill:transparent;stroke:none}
.part{cursor:move}
.part:hover .sym{stroke-width:1.85}
.part.sel .sym,.ghost .sym{stroke:var(--accent)}
.part.sel .symf,.ghost .symf{fill:var(--accent)}
.part.sel .hit{fill:var(--accent-soft);stroke:var(--accent);stroke-width:.5;stroke-dasharray:2 2}
.ghost{opacity:.75;pointer-events:none}
.pin{fill:transparent;stroke:none;pointer-events:none}
.stage.t-wire .pin,.part:hover .pin{fill:var(--bg);stroke:var(--accent);stroke-width:.9}
.wl{stroke:var(--wire);stroke-width:1.5;stroke-linecap:round;fill:none}
.whit{stroke:transparent;stroke-width:8;cursor:pointer}
.wire.sel .wl{stroke:var(--accent);stroke-width:2.2}
.wire.hl .wl{stroke-width:3.4}
.simon .wl{stroke:var(--volt)}
.simon .wire.g0 .wl{stroke:var(--muted)}
.simon .wire.neg .wl{stroke:var(--neg)}
.simon .wire.sel .wl{stroke:var(--accent)}
.jdot{fill:var(--wire)}
.simon .jdot{fill:var(--volt)}
.ref{font:600 7px var(--mono);fill:var(--text)}
.val{font:500 6.5px var(--mono);fill:var(--muted)}
.net{font:700 7px var(--mono);fill:var(--net)}
.pn{font:500 4.6px var(--mono);fill:var(--muted)}
.prev{stroke:var(--accent);stroke-width:1.4;stroke-dasharray:3 2;fill:none}
.cross{stroke:var(--muted);stroke-width:.6}
.pinring{fill:none;stroke:var(--accent);stroke-width:1.2}
.unc{fill:none;stroke:var(--warn);stroke-width:.9}
.box{fill:var(--accent-soft);stroke:var(--accent);stroke-width:.8;stroke-dasharray:3 2}
.vchip rect{fill:var(--solid);stroke:var(--volt);stroke-width:.7}
.vchip text{font:600 6px var(--mono);fill:var(--text)}
.vchip.neg rect{stroke:var(--neg)}
.flag{cursor:pointer}
.flag circle{fill:var(--danger);stroke:var(--bg);stroke-width:1.2}
.flag.warn circle{fill:var(--warn)}
.flag text{font:800 7px var(--ui);fill:var(--bg);pointer-events:none}
.dangle{fill:none;stroke:var(--warn);stroke-width:1.3;stroke-dasharray:2 1.5}
.glow{pointer-events:none}

/* phone dock & context bar */
.dock{display:none}
.cbar{display:none}

/* context menu */
.ctx{position:fixed;z-index:30;min-width:200px;padding:6px;display:flex;flex-direction:column;gap:1px}
.ctx button{display:flex;align-items:center;gap:10px;border:0;background:transparent;padding:8px 10px;border-radius:8px;text-align:left;font-weight:500}
.ctx button:hover,.ctx button:focus-visible{background:var(--raise)}
.ctx button kbd{margin-left:auto}
.ctx hr{border:0;height:1px;background:var(--line);margin:4px 2px}
.ctx .dng{color:var(--danger)}

/* modal */

.db textarea{width:100%;min-height:240px;resize:vertical;border:1px solid var(--line);border-radius:11px;background:var(--raise);padding:11px;font:12px/1.5 var(--mono)}
.dtabs{display:flex;gap:6px;flex-wrap:wrap}

.gallery{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px}

.pal-in{display:flex;align-items:center;gap:10px;padding:14px 16px;border-bottom:1px solid var(--line)}

.pal-item span{flex:1}

.welcome{position:absolute;left:50%;bottom:58px;transform:translateX(-50%);width:min(520px,calc(100% - 32px));padding:16px 18px;z-index:5;display:flex;flex-direction:column;gap:10px}

const nm=k=>SYM[k].n[lang==='id'?0:1];

/* ---------- values ---------- */
function parseSI(s){
  s=String(s==null?'':s).trim().replace(',','.').replace(/Ω|ohm/ig,'');
  let m=s.match(/^([+-]?)(\d+)V(\d+)$/i); if(m) return (m[1]==='-'?-1:1)*parseFloat(m[2]+'.'+m[3]);
  m=s.match(/^([+-]?)(\d*\.?\d+)\s*([pnuµmkKMGR])?(\d*)/); if(!m) return NaN;
  let num=m[2]; if(m[4]) num=num+(num.includes('.')?'':'.')+m[4];
  const mul={p:1e-12,n:1e-9,u:1e-6,'µ':1e-6,m:1e-3,k:1e3,K:1e3,M:1e6,G:1e9,R:1}[m[3]]||1;
  return (m[1]==='-'?-1:1)*parseFloat(num)*mul;
}
function fmt(v,u){
  if(!isFinite(v)) return '—';
  const a=Math.abs(v); if(a<1e-10) return '0 '+u;
  for(const [m,s] of [[1e9,'G'],[1e6,'M'],[1e3,'k'],[1,''],[1e-3,'m'],[1e-6,'µ'],[1e-9,'n'],[1e-12,'p']]){
    if(a>=m*0.9995){const x=v/m,ax=Math.abs(x);return (ax>=100?x.toFixed(0):ax>=10?x.toFixed(1):x.toFixed(2))+' '+s+u}
  }
  return v.toExponential(1)+' '+u;
}
function spiceNum(v){if(!isFinite(v))return '0';for(const [m,s] of [[1e9,'G'],[1e6,'Meg'],[1e3,'k'],[1,''],[1e-3,'m'],[1e-6,'u'],[1e-9,'n'],[1e-12,'p']]){if(Math.abs(v)>=m*0.9995)return +(v/m).toPrecision(4)+s}return String(v)}
const E12=[1,1.2,1.5,1.8,2.2,2.7,3.3,3.9,4.7,5.6,6.8,8.2];
function nearestE12(r){if(!(r>0))return NaN;const e=Math.floor(Math.log10(r));let best=0,bd=1e9;for(const d of [-1,0,1])for(const b of E12){const v=b*Math.pow(10,e+d);const dd=Math.abs(Math.log(v/r));if(dd<bd){bd=dd;best=v}}return +best.toPrecision(3)}
const BANDC=['#111','#7b4a2a','#d6262b','#f07a1a','#f5d300','#2a9a3a','#2059d0','#7d3fc2','#8a8a8a','#f4f4f4'];
function bandsFor(r){if(!(r>0))return null;let e=Math.floor(Math.log10(r))-1;let d=Math.round(r/Math.pow(10,e));if(d>=100){d=Math.round(d/10);e++}
  const mul=e===-1?'#c9a227':e===-2?'#b8bcc4':BANDC[e]; if(e<-2||e>9)return null;
  return [BANDC[Math.floor(d/10)],BANDC[d%10],mul,'#c9a227'];}

/* ---------- geometry ---------- */
function xf(p,lx,ly){let x=p.m?-lx:lx,y=ly;for(let i=0;i<(p.r||0);i++){const t=x;x=-y;y=t}return [p.x+x,p.y+y]}
function pinsOf(p){return SYM[p.k].pins.map(([n,x,y],i)=>({n,i,pt:xf(p,x,y)}))}
function onSeg(x,y,w){
  if(w.x1===w.x2) return x===w.x1&&y>Math.min(w.y1,w.y2)&&y<Math.max(w.y1,w.y2);
  if(w.y1===w.y2) return y===w.y1&&x>Math.min(w.x1,w.x2)&&x<Math.max(w.x1,w.x2);
  return false;
}
function netName(p){const s=SYM[p.k];if(!s.net)return null;return s.net==='val'?(String(p.val||'').trim()||null):s.net}
function lPath(a,b,v){if(a[0]===b[0]||a[1]===b[1])return [a,b];return [a,(v?[a[0],b[1]]:[b[0],a[1]]),b]}
function routeScore(pts,o){let sc=0;for(let i=0;i<pts.length-1;i++){const s={x1:pts[i][0],y1:pts[i][1],x2:pts[i+1][0],y2:pts[i+1][1]};
    o.parts.forEach(p=>{pinsOf(p).forEach(pn=>{if(onSeg(pn.pt[0],pn.pt[1],s))sc+=10});const b=partBox(p),mnx=Math.min(s.x1,s.x2),mxx=Math.max(s.x1,s.x2),mny=Math.min(s.y1,s.y2),mxy=Math.max(s.y1,s.y2);
      if(mxx>b[0]+2&&mnx<b[2]-2&&mxy>b[1]+2&&mny<b[3]-2)sc+=3});
    o.wires.forEach(w=>{if(w.x1===w.x2&&s.x1===s.x2&&w.x1===s.x1&&Math.min(w.y1,w.y2)<Math.max(s.y1,s.y2)&&Math.max(w.y1,w.y2)>Math.min(s.y1,s.y2))sc+=5;if(w.y1===w.y2&&s.y1===s.y2&&w.y1===s.y1&&Math.min(w.x1,w.x2)<Math.max(s.x1,s.x2)&&Math.max(w.x1,w.x2)>Math.min(s.x1,s.x2))sc+=5})}return sc}
function smartPath(a,b,v,o){o=o||S;const p1=lPath(a,b,v);if(p1.length<3)return p1;const p2=lPath(a,b,!v);return routeScore(p2,o)<routeScore(p1,o)?p2:p1}
function addWireTo(o,a,b,v,smart){const pts=smart?smartPath(a,b,v,o):lPath(a,b,v);for(let i=0;i<pts.length-1;i++){const p=pts[i],q=pts[i+1];if(p[0]!==q[0]||p[1]!==q[1])o.wires.push({id:'w'+(++o.n),x1:p[0],y1:p[1],x2:q[0],y2:q[1]})}}
function partBox(p){const [x,y,w,h]=SYM[p.k].bb;const cs=[[x,y],[x+w,y],[x,y+h],[x+w,y+h]].map(c=>xf(p,c[0],c[1]));return [Math.min(...cs.map(c=>c[0])),Math.min(...cs.map(c=>c[1])),Math.max(...cs.map(c=>c[0])),Math.max(...cs.map(c=>c[1]))]}
function boundsOf(o){let b=null;const add=(x,y)=>{if(!b)b=[x,y,x,y];else{b[0]=Math.min(b[0],x);b[1]=Math.min(b[1],y);b[2]=Math.max(b[2],x);b[3]=Math.max(b[3],y)}};
  o.parts.forEach(p=>{const q=partBox(p);add(q[0],q[1]);add(q[2],q[3])});o.wires.forEach(w=>{add(w.x1,w.y1);add(w.x2,w.y2)});return b}

/* ---------- connectivity ---------- */
function analyze(){
  const par=new Map();
  const find=k=>{if(!par.has(k)){par.set(k,k);return k}let r=k;while(par.get(r)!==r)r=par.get(r);while(par.get(k)!==r){const n=par.get(k);par.set(k,r);k=n}return r};
  const uni=(a,b)=>{a=find(a);b=find(b);if(a!==b)par.set(a,b)};
  const cnt=new Map(),inc=(k,n=1)=>cnt.set(k,(cnt.get(k)||0)+n);
  const pts=new Map();
  S.wires.forEach(w=>{const a=K(w.x1,w.y1),b=K(w.x2,w.y2);uni(a,b);inc(a);inc(b);pts.set(a,[w.x1,w.y1]);pts.set(b,[w.x2,w.y2])});
  const pinRecs=[];
  S.parts.forEach(p=>pinsOf(p).forEach(pn=>{const k=K(pn.pt[0],pn.pt[1]);find(k);inc(k);pts.set(k,pn.pt);pinRecs.push({p,pn,k});const nn=netName(p);if(nn)uni(k,'net:'+nn)}));
  pts.forEach(([x,y],k)=>S.wires.forEach(w=>{if(onSeg(x,y,w)){uni(k,K(w.x1,w.y1));inc(k,2)}}));
  const dots=[];pts.forEach((pt,k)=>{if((cnt.get(k)||0)>=3)dots.push(pt)});
  const groups=new Map(),names=new Map();
  pinRecs.forEach(r=>{const root=find(r.k);if(!groups.has(root))groups.set(root,[]);groups.get(root).push(r);const nn=netName(r.p);if(nn&&!names.has(root))names.set(root,nn)});
  let auto=0;const nets=[];
  [...groups.entries()].sort((a,b)=>{const pa=a[1][0].pn.pt,pb=b[1][0].pn.pt;return pa[0]-pb[0]||pa[1]-pb[1]}).forEach(([root,recs])=>{
    const real=recs.filter(r=>!SYM[r.p.k].net);
    const name=names.get(root)||('N$'+(++auto));
    if(real.length||names.has(root))nets.push({root,name,members:real.map(r=>r.p.ref+'-'+r.pn.n),recs,named:names.has(root)});
  });
  nets.sort((a,b)=>(b.named-a.named)||a.name.localeCompare(b.name,undefined,{numeric:true}));
  const netOfRoot=new Map(nets.map(n=>[n.root,n]));
  const unc=pinRecs.filter(r=>(cnt.get(r.k)||0)<2);
  return {find,dots,nets,unc,netOfRoot,pinRecs,cnt};
}

/* ---------- DC simulator (modified nodal analysis + Newton-Raphson) ---------- */
function exl(x){if(x>80){const e=Math.exp(80);return [e*(1+x-80),e]}const e=Math.exp(x);return [e,e]}
function dio(v,Is,nvt){const [e,de]=exl(v/nvt);return [Is*(e-1),Is*de/nvt]}
function pnjlim(vn,vo,vt,vc){if(vn>vc&&Math.abs(vn-vo)>2*vt){if(vo>0){const a=1+(vn-vo)/vt;vn=a>0?vo+vt*Math.log(a):vc}else vn=vt*Math.log(vn/vt)}return vn}
function lsolve(M,b){const n=b.length;for(let c=0;c<n;c++){let p=c,mx=Math.abs(M[c][c]);for(let r=c+1;r<n;r++){const v=Math.abs(M[r][c]);if(v>mx){mx=v;p=r}}if(mx<1e-30)return null;if(p!==c){const t=M[p];M[p]=M[c];M[c]=t;const u=b[p];b[p]=b[c];b[c]=u}
  const pv=M[c][c],Mc=M[c];for(let r=c+1;r<n;r++){const Mr=M[r],f=Mr[c]/pv;if(f===0)continue;for(let k=c;k<n;k++)Mr[k]-=f*Mc[k];b[r]-=f*b[c]}}
  const x=new Float64Array(n);for(let r=n-1;r>=0;r--){let s=b[r];const Mr=M[r];for(let k=r+1;k<n;k++)s-=Mr[k]*x[k];x[r]=s/Mr[r]}return x}
const SIMK=new Set(['R','POT','C','CP','L','D','ZD','LED','NPN','PNP','OPAMP','BAT','SW','LAMP','VCC']);
const RATE={R:0.25,POT:0.5};
function lampParams(v){const s=String(v||'');const V=parseFloat((s.match(/([\d.]+)\s*V/i)||[])[1])||12;const W=parseFloat((s.match(/([\d.]+)\s*W/i)||[])[1])||2;return {V,W,R:V*V/W}}
function simulate(){
  const R={ok:false,err:null,iters:0,nodeV:new Map(),parts:new Map(),issues:[],gRoot:null,vmax:0};
  const iss=(lv,p,t,d,code)=>R.issues.push({lv,id:p?p.id:null,t,d,code});
  if(!S.parts.some(p=>SIMK.has(p.k))){R.err='empty';return R}
  let gRoot=null;
  if(S.parts.some(p=>p.k==='GND'))gRoot=A.find('net:GND');
  else{const b=S.parts.find(p=>p.k==='BAT');if(b){gRoot=A.find(K(...pinsOf(b)[1].pt));iss('info',b,L('Tidak ada simbol Ground','No ground symbol'),L(`Kutub − ${b.ref} dipakai sebagai 0 V.`,`${b.ref} negative terminal is used as 0 V.`),'gndbat')}
    else{R.err='noGround';return R}}
  R.gRoot=gRoot;
  const idx=new Map(),intern=new Map();let N=0;
  const nodeOf=pt=>{const r=A.find(K(pt[0],pt[1]));if(r===gRoot)return -1;if(!idx.has(r))idx.set(r,N++);return idx.get(r)};
  const els=[];
  // supply rails for op-amps
  let vhi=0,vlo=0;
  S.parts.forEach(p=>{if(p.k==='VCC'){const v=parseSI(p.val);if(isFinite(v)){vhi=Math.max(vhi,v);vlo=Math.min(vlo,v)}}if(p.k==='BAT'){const v=parseSI(p.val);if(isFinite(v))vhi=Math.max(vhi,v)}});
  if(vhi===0&&vlo===0)vhi=5;R.vhi=vhi;
  S.parts.forEach(p=>{
    if(!SIMK.has(p.k)){if(p.k==='U555')iss('info',p,L(`${p.ref} tidak disimulasikan`,`${p.ref} is not simulated`),L('Simulasi DC belum mendukung IC 555; pin-pinnya dianggap terbuka.','DC simulation does not model the 555 yet; its pins are left open.'),'nosim');return}
    const nd=pinsOf(p).map(pn=>nodeOf(pn.pt)),val=parseSI(p.val);
    const bad=()=>iss('warn',p,L(`Nilai ${p.ref} tidak terbaca`,`Can't read ${p.ref} value`),L(`"${p.val}" bukan angka. Contoh: 4k7, 330, 100n.`,`"${p.val}" is not a number. Try 4k7, 330, 100n.`),'badval');
    switch(p.k){
      case 'R':{let r=val;if(!(r>0)){bad();r=1e3}els.push({t:'G',a:nd[0],b:nd[1],g:1/Math.max(r,1e-3),p});break}
      case 'POT':{let r=val;if(!(r>0)){bad();r=1e4}const pos=p.pos==null?.5:p.pos;els.push({t:'G',a:nd[0],b:nd[2],g:1/Math.max(r*(1-pos),.5)});els.push({t:'G',a:nd[2],b:nd[1],g:1/Math.max(r*pos,.5)});break}
      case 'C':case 'CP':break;
      case 'L':els.push({t:'G',a:nd[0],b:nd[1],g:1e3});break;
      case 'LAMP':{const lp=lampParams(p.val);els.push({t:'G',a:nd[0],b:nd[1],g:1/lp.R});break}
      case 'SW':if(p.on)els.push({t:'G',a:nd[0],b:nd[1],g:100});break;
      case 'BAT':{let v=val;if(!isFinite(v)){bad();v=9}const g=1/0.5;els.push({t:'G',a:nd[0],b:nd[1],g});els.push({t:'I',a:nd[0],b:nd[1],i:v*g});break}
      case 'VCC':{let v=val;if(!isFinite(v)){bad();v=5}const g=100;els.push({t:'G',a:nd[0],b:-1,g});els.push({t:'I',a:nd[0],b:-1,i:v*g});break}
      case 'D':{const Is=2.52e-9,n=1.752,ni=N++;intern.set(p.id,[ni,0.6]);els.push({t:'G',a:ni,b:nd[1],g:1/0.6});els.push({t:'D',a:nd[0],b:ni,Is,nvt:n*VT,off:0,vo:0,vc:n*VT*Math.log(n*VT/(Math.SQRT2*Is))});break}
      case 'LED':{const li=ledInfo(p.val),n=2,Is=0.02/Math.exp(li.vf/(n*VT)),ni=N++;intern.set(p.id,[ni,2]);els.push({t:'G',a:ni,b:nd[1],g:0.5});els.push({t:'D',a:nd[0],b:ni,Is,nvt:n*VT,off:0,vo:0,vc:n*VT*Math.log(n*VT/(Math.SQRT2*Is))});break}
      case 'ZD':{let vz=val;if(!(vz>0)){bad();vz=5.1}const Is=1e-12,n=1.2,Isr=5e-3,nr=1.5;
        els.push({t:'D',a:nd[0],b:nd[1],Is,nvt:n*VT,off:0,vo:0,vc:n*VT*Math.log(n*VT/(Math.SQRT2*Is))});
        els.push({t:'D',a:nd[1],b:nd[0],Is:Isr,nvt:nr*VT,off:vz,vo:0,vc:nr*VT*Math.log(nr*VT/(Math.SQRT2*Isr))});break}
      case 'NPN':case 'PNP':{const Is=1e-14;els.push({t:'Q',b:nd[0],c:p.k==='NPN'?nd[1]:nd[2],e:p.k==='NPN'?nd[2]:nd[1],s:p.k==='NPN'?1:-1,Is,bf:250,br:3,obe:0,obc:0,vc:VT*Math.log(VT/(Math.SQRT2*Is))});break}
      case 'OPAMP':{const hi=vhi>0?vhi-1.2:0.05,lo=vlo<0?vlo+1.2:0.02;els.push({t:'OA',n:nd[0],p:nd[1],o:nd[2],A:1e5,ro:20,mid:(hi+lo)/2,half:Math.max((hi-lo)/2,.05)});break}
    }
  });
  const x=new Float64Array(N);
  const V=i=>i<0?0:x[i];
  let conv=false,it;
  for(it=0;it<400&&N>0;it++){
    const M=[];for(let i=0;i<N;i++){const r=new Float64Array(N);r[i]=1e-9;M.push(r)}
    const b=new Float64Array(N);let limited=false;
    const addG=(a,c,g)=>{if(a>=0)M[a][a]+=g;if(c>=0)M[c][c]+=g;if(a>=0&&c>=0){M[a][c]-=g;M[c][a]-=g}};
    for(const el of els){switch(el.t){
      case 'G':addG(el.a,el.b,el.g);break;
      case 'I':if(el.a>=0)b[el.a]+=el.i;if(el.b>=0)b[el.b]-=el.i;break;
      case 'D':{const vd=V(el.a)-V(el.b)-el.off,vl=pnjlim(vd,el.vo,el.nvt,el.vc);if(Math.abs(vl-vd)>1e-9)limited=true;el.vo=vl;
        const [I,g0]=dio(vl,el.Is,el.nvt),g=g0+1e-12;addG(el.a,el.b,g);const c=I-g*(vl+el.off);if(el.a>=0)b[el.a]-=c;if(el.b>=0)b[el.b]+=c;break}
      case 'Q':{const s=el.s,vbe=s*(V(el.b)-V(el.e)),vbc=s*(V(el.b)-V(el.c));
        const lbe=pnjlim(vbe,el.obe,VT,el.vc),lbc=pnjlim(vbc,el.obc,VT,el.vc);if(Math.abs(lbe-vbe)>1e-9||Math.abs(lbc-vbc)>1e-9)limited=true;el.obe=lbe;el.obc=lbc;
        const [ef,def]=exl(lbe/VT),[er,der]=exl(lbc/VT),Is=el.Is,bf=el.bf,br=el.br;
        const Ic=Is*(ef-er)-Is/br*(er-1),Ib=Is/bf*(ef-1)+Is/br*(er-1),Ie=-(Ic+Ib);
        const gf=Is*def/VT+1e-12,gr=Is*der/VT+1e-12;
        const D={c:[gf,-gr-gr/br],b:[gf/bf,gr/br]};D.e=[-(D.c[0]+D.b[0]),-(D.c[1]+D.b[1])];
        const I0={c:Ic,b:Ib,e:Ie},abe=s*lbe,abc=s*lbc;
        for(const t of ['c','b','e']){const k=el[t];if(k<0)continue;const [dbe,dbc]=D[t];
          if(el.b>=0)M[k][el.b]+=dbe+dbc;if(el.e>=0)M[k][el.e]-=dbe;if(el.c>=0)M[k][el.c]-=dbc;

function runFix(key){const i=ISS.find(x=>x.key===key);if(!i||!i.fix)return;track('perbaiki');inFix=true;let r;try{r=i.fix.run()}finally{inFix=false}

function proactive(silent){

function lbl(p,off,txt,cls){const [x,y]=xf(p,off[0],off[1]),ox=x-p.x,oy=y-p.y;const a=Math.abs(ox)>Math.abs(oy)?(ox>0?'start':'end'):'middle';

  s.pins.forEach(([n,x,y])=>h+=`<circle class="pin" cx="${x}" cy="${y}" r="2.4"/>`);
  h+='</g>';
  if(!noText){let ro=s.ref,vo=s.val;if(ro&&vo&&!s.noRef&&!s.noVal){const a=xf(p,ro[0],ro[1]),b=xf(p,vo[0],vo[1]),sa=Math.sign(a[0]-p.x),sb=Math.sign(b[0]-p.x);if(Math.abs(a[1]-b[1])<7&&sa===sb&&sa!==0&&Math.abs(a[0]-p.x)>Math.abs(a[1]-p.y)){const loc=(pt,dy)=>{let X=pt[0]-p.x,Y=pt[1]-p.y+dy;for(let i=0;i<(4-(p.r||0))%4;i++){const t=X;X=Y;Y=-t}return [p.m?-X:X,Y]};const xa=Math.abs(a[0]-p.x)<Math.abs(b[0]-p.x)?a:b;ro=loc([xa[0],xa[1]],-4.5);vo=loc([xa[0],xa[1]],4.5)}}

function readout(p,r){

    case 'POT':h+=ro('V wiper',fmt(r.V,'V'))+ro(L('Arus','Current'),fmt(Math.abs(r.I),'A'))+ro(L('Daya','Power'),fmt(r.P,'W'),r.P>RATE.POT?'bad':'');break;
    case 'LED':case 'D':case 'ZD':h+=ro('V',fmt(r.V,'V'))+ro(L('Arus','Current'),fmt(r.I,'A'),p.k==='LED'&&r.I>0.03?'bad':p.k==='LED'&&r.I>0.022?'warn':'')+(p.k==='LED'?ro(L('Nyala','Brightness'),Math.round(Math.min(r.glow,1)*100)+'%'):ro(L('Daya','Power'),fmt(Math.abs(r.V*r.I),'W')));break;
    case 'NPN':case 'PNP':h+=ro('Ic',fmt(r.Ic,'A'),r.Ic>0.1?'bad':'')+ro('Ib',fmt(r.Ib,'A'))+ro('Vce',fmt(r.Vce,'V'))+`</div><p class="hintline">${L('Kondisi','State')}: <b>${r.region}</b> · Vbe ${fmt(r.Vbe,'V')}${r.Ib>1e-9?' · hFE '+Math.round(r.Ic/r.Ib):''}</p><div>`;break;
    case 'BAT':case 'VCC':h+=ro(L('Tegangan','Voltage'),fmt(r.V,'V'))+ro(L('Arus','Current'),fmt(r.I,'A'),r.I>1.5?'bad':'')+ro(L('Daya','Power'),fmt(r.P,'W'));break;
    case 'LAMP':h+=ro('V',fmt(r.V,'V'))+ro(L('Arus','Current'),fmt(r.I,'A'))+ro(L('Daya','Power'),fmt(r.P,'W'));break;
    case 'SW':h+=ro('V',fmt(r.V,'V'))+ro(L('Arus','Current'),fmt(r.I,'A'));break;
    case 'C':case 'CP':h+=ro(L('Tegangan','Voltage'),fmt(r.V,'V'))+ro(L('Muatan','Charge'),fmt(Math.abs(r.V*(parseSI(p.val)||0)),'C'));break;

  }
  return h+'</div>';
}

function spice(){
  const nn=new Map();let auto=0;
  const nodeName=pt=>{const root=A.find(K(pt[0],pt[1]));if(SIM&&SIM.gRoot===root)return '0';const n=A.netOfRoot.get(root);if(n&&n.named){if(n.name==='GND')return '0';return n.name.replace(/[^A-Za-z0-9_]/g,c=>c==='+'?'P':c==='-'?'N':'_')}
    if(!nn.has(root))nn.set(root,'N'+String(++auto).padStart(3,'0'));return nn.get(root)};
  const L1=[`* ${S.name} — Rangkai netlist (${new Date().toISOString().slice(0,10)})`,'* Buka di LTspice / ngspice'],models=new Set();
  const supplies=new Set();
  S.parts.forEach(p=>{const nd=pinsOf(p).map(pn=>nodeName(pn.pt)),v=parseSI(p.val),ref=p.ref.replace(/[^A-Za-z0-9_]/g,'');
    switch(p.k){
      case 'R':L1.push(`R${ref.replace(/^R/,'')} ${nd[0]} ${nd[1]} ${spiceNum(v)}`);break;
      case 'POT':{const pos=p.pos==null?.5:p.pos;L1.push(`R${ref}_A ${nd[0]} ${nd[2]} ${spiceNum(Math.max(v*(1-pos),.5))}`,`R${ref}_B ${nd[2]} ${nd[1]} ${spiceNum(Math.max(v*pos,.5))}`);break}
      case 'C':case 'CP':L1.push(`C${ref.replace(/^C/,'')} ${nd[0]} ${nd[1]} ${spiceNum(v)}`);break;
      case 'L':L1.push(`L${ref.replace(/^L/,'')} ${nd[0]} ${nd[1]} ${spiceNum(v)}`);break;
      case 'D':L1.push(`D${ref.replace(/^D/,'')} ${nd[0]} ${nd[1]} D1N4148`);models.add('.model D1N4148 D(Is=2.52n N=1.752 Rs=0.568 BV=100)');break;
      case 'ZD':L1.push(`D${ref.replace(/^D/,'')} ${nd[0]} ${nd[1]} DZ${String(v).replace('.','V')}`);models.add(`.model DZ${String(v).replace('.','V')} D(Is=1p N=1.2 BV=${v} IBV=5m)`);break;
      case 'LED':{const li=ledInfo(p.val);L1.push(`D${ref} ${nd[0]} ${nd[1]} LED_${li.key.toUpperCase()}`);models.add(`.model LED_${li.key.toUpperCase()} D(Is=${(0.02/Math.exp(li.vf/(2*VT))).toExponential(3)} N=2)`);break}
      case 'NPN':L1.push(`Q${ref.replace(/^Q/,'')} ${nd[1]} ${nd[0]} ${nd[2]} QNPN`);models.add('.model QNPN NPN(Is=10f Bf=250 Br=3)');break;
      case 'PNP':L1.push(`Q${ref.replace(/^Q/,'')} ${nd[2]} ${nd[0]} ${nd[1]} QPNP`);models.add('.model QPNP PNP(Is=10f Bf=250 Br=3)');break;
      case 'BAT':L1.push(`V${ref} ${nd[0]} ${nd[1]} DC ${spiceNum(v)}`);break;
      case 'VCC':if(!supplies.has(nd[0])&&nd[0]!=='0'){supplies.add(nd[0]);L1.push(`V_${nd[0]} ${nd[0]} 0 DC ${spiceNum(v)}`)}break;
      case 'SW':L1.push(p.on?`R${ref}_SW ${nd[0]} ${nd[1]} 10m`:`* ${p.ref} terbuka / open`);break;
      case 'LAMP':L1.push(`R${ref}_LAMP ${nd[0]} ${nd[1]} ${spiceNum(lampParams(p.val).R)}`);break;
      case 'OPAMP':L1.push(`E${ref} ${nd[2]} 0 ${nd[1]} ${nd[0]} 100k`);break;
      case 'U555':L1.push(`* ${p.ref} NE555: pin ${pinsOf(p).map((pn,i)=>pn.n+'='+nd[i]).join(' ')} (tidak dimodelkan / not modelled)`);break;
      case 'J2':L1.push(`* ${p.ref} ${p.val}: ${nd.join(' ')}`);break;
    }});

}

  if(k==='escape'){if(wireStart){wireStart=null;if(wireFromSelect){tool='select';wireFromSelect=false}render({noSim:true})}else if(tool!=='select')setTool('select');else{sel.clear();hlNet=null;render({noSim:true})}}
  if(['arrowup','arrowdown','arrowleft','arrowright'].includes(k)&&sel.size){e.preventDefault();const d=G*(e.shiftKey?5:1),dx=k==='arrowleft'?-d:k==='arrowright'?d:0,dy=k==='arrowup'?-d:k==='arrowdown'?d:0;
    const sn=dragSnap();sn.parts.forEach(o=>{o.p.x+=dx;o.p.y+=dy});sn.wires.forEach(o=>{if(o.e1){o.w.x1+=dx;o.w.y1+=dy}if(o.e2){o.w.x2+=dx;o.w.y2+=dy}});fixDiagonals(sn);changed()}
});

function mk(){const s={parts:[],wires:[],n:0};const P=(k,x,y,o={})=>{const p={id:'p'+(++s.n),k,x,y,r:o.r||0,m:!!o.m,ref:'',val:o.val!=null?o.val:SYM[k].v};if(k==='SW')p.on=o.on!=null?o.on:true;if(k==='POT')p.pos=o.pos!=null?o.pos:.5;s.parts.push(p);return p};
  const pin=(p,n)=>{const d=SYM[p.k].pins.find(q=>q[0]===n);return xf(p,d[1],d[2])};const W=(a,b,v)=>addWireTo(s,a,b,v);
  const done=()=>{const save=S;S=s;s.parts.forEach(p=>{if(!p.ref)p.ref=SYM[p.k].net?SYM[p.k].pre.replace('#','')+s.n++:nextRef(SYM[p.k].pre,s)});S=save;s.n=Math.max(s.n,1000);return s};return {s,P,pin,W,done}}

(function boot(){
  const th=fetchStore('rangkai2.theme')||(()=>{try{return localStorage.getItem('rangkai2.theme')}catch(e){return null}})();if(th==='dark'||th==='light')document.documentElement.dataset.theme=th;
